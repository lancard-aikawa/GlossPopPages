<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlossPop Pages</title>
<meta name="description" content="GlossPop で書き出した用語辞書の公開ページ。本文も辞書も 1 枚ずつに焼き込んであるので、サーバが無くても読めます。">
<meta property="og:type" content="website">
<meta property="og:title" content="GlossPop Pages">
<meta property="og:description" content="GlossPop で書き出した用語辞書の公開ページ。">
<meta property="og:url" content="https://lancard-aikawa.github.io/GlossPopPages/">
<style>
:root { --bg:#fbfbfa; --fg:#1c1c1a; --dim:#63635e; --line:#e3e1dc; --accent:#0f766e; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#17181a; --fg:#e7e7e4; --dim:#a6a8a5; --line:#2c2f36; --accent:#5eead4; }
}
* { box-sizing: border-box; }
body { margin:0; padding:0 20px 72px; background:var(--bg); color:var(--fg);
  font-family:"Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  line-height:1.8; }
.wrap { max-width:820px; margin:0 auto; }
header { padding:56px 0 24px; border-bottom:1px solid var(--line); }
h1 { margin:0 0 10px; font-size:1.9rem; }
.lede { margin:0 0 10px; }
.muted { color:var(--dim); }
a { color:var(--accent); }
.card { display:block; margin:32px 0 0; padding:22px; border:1px solid var(--line);
  border-radius:12px; }
.card h2 { margin:0 0 6px; font-size:1.25rem; }
.card p { margin:0 0 14px; color:var(--dim); }
.card img { display:block; width:100%; height:auto; border-radius:8px; }
footer { margin:56px 0 0; padding-top:20px; border-top:1px solid var(--line);
  color:var(--dim); font-size:.88rem; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>GlossPop Pages</h1>
  <p class="lede">
    <a href="https://github.com/lancard-aikawa/GlossPop">GlossPop</a>
    で書き出した用語辞書。本文の語にふれると意味が出ます。
  </p>
  <p class="lede muted">
    辞書も本文も 1 枚ずつに焼き込んであるので、<strong>GlossPop を持っていなくても、
    サーバが無くても読めます</strong>（通信もしません）。
  </p>
</header>

<main>

  <article class="card">
    <h2><a href="sengoku-jidai/">戦国時代</a></h2>
    <p>史実と諸説の並記を試した辞書。25 語 / 関係 40 本。桶狭間の進軍路は
      2 説を同じ地図の上に置いてあります。</p>
    <a href="sengoku-jidai/"><img src="sengoku-jidai/card.png" alt="戦国時代 —— 同じ日に、2 つの事件"
      width="1200" height="630"></a>
  </article>

</main>

<footer>
  <p>素材は
    <a href="https://github.com/lancard-aikawa/GlossPop/tree/main/samples">GlossPop の samples</a>
    にあります。</p>
</footer>

</div>
</body>
</html>
